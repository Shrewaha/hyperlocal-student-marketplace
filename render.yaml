# Deploy the backend to Render (https://render.com) on the free plan.
#
# Render reads this file when you create a Blueprint from the repository, so
# there is nothing to configure in their dashboard:
#
#   New  ->  Blueprint  ->  pick this repo  ->  Apply
#
# You get a URL like https://marketplace-api-xxxx.onrender.com. Put that into
# web/config.js so the browser client talks to it.
#
# Two things about the free plan worth knowing before you share the link:
#
#   * The service sleeps after about 15 minutes with no traffic, and the next
#     request takes 30-60 seconds while it wakes. Nothing is broken; it is
#     just cold.
#   * The disk is wiped on every restart and redeploy. marketplace.db goes
#     with it, so accounts and offers are demo data, not permanent records.
#     Moving to Postgres is what fixes that, and it is a backend change rather
#     than a hosting one.

services:
  - type: web
    name: marketplace-api
    runtime: python
    plan: free
    region: singapore # closest Render region to India; frankfurt/oregon also exist
    buildCommand: pip install -r requirements.txt
    # $PORT is assigned by Render at boot, and binding to 0.0.0.0 rather than
    # localhost is what makes the service reachable from outside the container.
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Mail is live. Until SMTP_USER is filled in from the dashboard the
      # emailer still prints to the service log rather than failing every
      # send against an unauthenticated server -- so this flag being false
      # is safe before the credentials exist, and starts working the moment
      # they do.
      - key: EMAIL_CONSOLE_ONLY
        value: "false"
      - key: EMAIL_ENABLED
        value: "true"
      - key: APP_NAME
        value: HyperLocal Student Marketplace
      # Where the browser client lives. Used to build the link inside a
      # password-reset email; without it the email carries a code to paste
      # instead, which works but reads badly.
      - key: APP_URL
        value: https://shrewaha.github.io/hyperlocal-student-marketplace
      # SMTP credentials. sync:false keeps them out of the repository -- set
      # each one in the Render dashboard. For Gmail, SMTP_USER is the full
      # address and SMTP_PASSWORD is a 16-character App Password, not the
      # account password.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # How long a sign-in survives without being used. The window slides on
      # every request, so an active user is never signed out.
      - key: SESSION_TTL_DAYS
        value: "30"
      # How long a password-reset link stays valid, in minutes.
      - key: RESET_TTL_MINUTES
        value: "60"
      # Comma-separated addresses that may manage accounts. Left blank on
      # purpose: fill it in from the dashboard, so an owner list is never
      # committed to a public repository.
      - key: ADMIN_EMAILS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
