# Builds the downloadable client and publishes it to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# Three things come out of it:
#
#   MarketplaceApp.jar              one file, any OS, needs Java 17+ installed
#   HyperLocalMarketplace-*.zip     app folder with a Java runtime inside
#   SHA256SUMS.txt                  checksums for all of the above
#
# The zips exist because most students do not have a JDK installed and should
# not have to. jpackage bundles a trimmed runtime next to the app, so the
# download is unzip-and-run.

name: release

on:
  push:
    tags:
      - "v*"
  # Lets you rebuild the downloads from the Actions tab, without moving tags
  # around. Useful when a release exists but its files are missing or need
  # replacing: give it the tag and it attaches the results to that release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to (e.g. v1.0.0). Leave blank to build without publishing."
        required: false
        default: ""

permissions:
  contents: write # required to create the release and upload files to it

jobs:
  # ---------------------------------------------------------------------------
  # One universal jar, built once. Every platform bundle is made from this same
  # file, so there is no chance of the Windows download being a different build
  # from the macOS one.
  # ---------------------------------------------------------------------------
  jar:
    name: Build the universal jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -B -f frontend/pom.xml clean package

      - name: Upload the jar for the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: frontend/target/MarketplaceApp.jar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Self-contained app bundles. jpackage can only build for the OS it runs on,
  # hence the matrix. macOS appears twice because Apple Silicon and Intel need
  # different runtimes.
  # ---------------------------------------------------------------------------
  bundle:
    name: Bundle for ${{ matrix.label }}
    needs: jar
    runs-on: ${{ matrix.os }}
    # A runner that is slow, missing or broken should not be able to stall the
    # release indefinitely. After this, the job fails and publish carries on
    # with the platforms that did build.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          # Intel Macs. macos-13 was the label for this until GitHub retired
          # the Ventura images; a job asking for it now queues forever instead
          # of failing, which is why the publish job below no longer waits for
          # every platform to succeed.
          - os: macos-15-intel
            label: macos-x64

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Download the jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist

      - name: Work out the version
        id: version
        shell: bash
        run: |
          # jpackage demands a version starting with a digit, so the leading
          # "v" comes off. A tag push takes its version from the tag; a manual
          # run takes it from the tag typed into the form, and falls back to a
          # placeholder when that was left blank.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            raw="${GITHUB_REF_NAME}"
          else
            raw="${{ inputs.tag }}"
          fi
          if [ -z "$raw" ]; then
            echo "number=0.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "number=${raw#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app image
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --input dist \
            --main-jar MarketplaceApp.jar \
            --main-class Launcher \
            --name HyperLocalMarketplace \
            --app-version "${{ steps.version.outputs.number }}" \
            --description "HyperLocal Student Marketplace client" \
            --copyright "Shreyansh Kushwaha" \
            --vendor "Shreyansh Kushwaha" \
            --dest out

      - name: Compress (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path out/HyperLocalMarketplace `
            -DestinationPath "HyperLocalMarketplace-${{ steps.version.outputs.number }}-${{ matrix.label }}.zip"

      - name: Compress (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # -y keeps symlinks as symlinks; a .app bundle is full of them and
        # flattening them produces an app macOS refuses to launch.
        run: |
          cd out
          zip -r -y "../HyperLocalMarketplace-${{ steps.version.outputs.number }}-${{ matrix.label }}.zip" \
            HyperLocalMarketplace.app

      - name: Compress (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "HyperLocalMarketplace-${{ steps.version.outputs.number }}-${{ matrix.label }}.tar.gz" \
            -C out HyperLocalMarketplace

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect everything and attach it to the release.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish the release
    needs: [jar, bundle]
    # always() keeps this job alive when a bundle fails, so one broken platform
    # costs you that one download instead of the entire release. The jar is the
    # only hard requirement -- without it there is nothing worth publishing.
    if: >-
      always() && needs.jar.result == 'success'
      && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Collect every build
        uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Flatten and checksum
        run: |
          mkdir -p release
          find staged -type f \( -name '*.jar' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec mv {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # On a tag push this is the tag that triggered the run. On a manual
          # run it is the tag typed into the form, which is what lets you
          # repair an existing release without re-tagging anything.
          tag_name: ${{ inputs.tag || github.ref_name }}
          # draft was true when this workflow expected to create the release
          # itself. The release is now made first, by hand or by the tag, so
          # drafting here would unpublish a live page. This step only attaches
          # files to what is already there, and leaves the notes alone.
          draft: false
          fail_on_unmatched_files: true
