name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check every Python file compiles
        run: python -m compileall -q backend

      - name: Run the email notification tests
        working-directory: backend
        run: python test_emailer.py

      - name: Run the auth tests
        working-directory: backend
        run: python test_auth.py

      - name: Check an existing database still upgrades
        working-directory: backend
        run: python test_upgrade.py

      - name: Start the API and check it answers
        working-directory: backend
        env:
          EMAIL_CONSOLE_ONLY: "true"
        run: |
          uvicorn main:app --port 8000 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API is up"
              curl -s http://127.0.0.1:8000/api/health
              exit 0
            fi
            sleep 1
          done
          echo "API did not start in 20 seconds"
          exit 1

  frontend:
    name: Build the desktop client
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build the client jar
        run: mvn -B -f frontend/pom.xml clean package

      - name: Check the jar is runnable
        # No display on a CI runner, so the window cannot open. Loading the
        # launcher proves the jar is well formed and JavaFX resolved; actually
        # starting the UI is what the release bundles are for.
        run: |
          unzip -l frontend/target/MarketplaceApp.jar | grep -q 'MarketplaceApp.class'
          unzip -l frontend/target/MarketplaceApp.jar | grep -q 'Launcher.class'
          unzip -p frontend/target/MarketplaceApp.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: Launcher'
          echo "jar looks right"

  android:
    name: Build the Android app
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Check the web client actually made it inside
        # The APK is a WebView around web/. If the copy task silently produced
        # nothing, the app still installs and opens to a blank white screen,
        # which is a miserable thing to discover on a phone.
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "built: $APK"
          unzip -l "$APK" | grep -q 'assets/web/index.html' || { echo "index.html missing from the APK"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/web/app.js'
          unzip -l "$APK" | grep -q 'assets/web/config.js'
          echo "web client is bundled"
